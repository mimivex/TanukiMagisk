<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example WebUI</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 8px 16px; }
    pre { background: #222; color: #eee; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Example WebUI</h1>
  <p>This page is served from the module's <code>webroot/</code> directory
     and talks to the manager through <code>window.ksu</code>.</p>
  <input id="cmd" value="id">
  <button id="run">Run as root</button>
  <button id="info">Module info</button>
  <button id="hello">Toast</button>
  <pre id="out">ready</pre>
  <script src="index.js"></script>
</body>
</html>
